<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OxfordAQA Economics 教学站</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #1d4ed8;
      --border: #dbe3ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .hero {
      background: linear-gradient(120deg, #dbeafe, #eef2ff);
      border: 1px solid #bfd0ff;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 18px;
    }
    .muted { color: var(--muted); }
    .cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 16px;
    }
    @media (min-width: 900px) {
      .cards { grid-template-columns: 1fr 1fr; }
    }
    .card-link {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      text-decoration: none;
      color: inherit;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .card-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(29, 78, 216, 0.12);
      border-color: #93c5fd;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      color: #1d4ed8;
      margin-bottom: 8px;
    }
    h1, h2, h3 { margin: 0 0 10px; }
    ul { margin: 0; padding-left: 20px; }
  </style>
</head>
<body>
  <main class="container">
    <section class="hero">
      <h1>YOGA's Lecture: OxfordAQA AS & A-level Economics</h1>
      <p class="muted">首页改为四个可点击板块：点击后进入每个 Unit 的详细知识点总览页面。</p>
    </section>

    <section>
      <h2>选择教学单元</h2>
      <div class="cards">
        <a class="card-link" href="./as-micro-unit1/index.html">
          <span class="badge">Unit 1</span>
          <h3>AS Micro（Unit 1）</h3>
          <p class="muted">市场机制、弹性、市场失灵、政府干预。</p>
        </a>

        <a class="card-link" href="./as-macro-unit2/index.html">
          <span class="badge">Unit 2</span>
          <h3>AS Macro（Unit 2）</h3>
          <p class="muted">宏观指标、AD/AS、失业、通胀、宏观政策。</p>
        </a>

        <a class="card-link" href="./a2-micro-unit3/index.html">
          <span class="badge">Unit 3</span>
          <h3>A2 Micro（Unit 3）</h3>
          <p class="muted">企业理论、市场结构、效率、劳动市场、分配。</p>
        </a>

        <a class="card-link" href="./a2-macro-unit4/index.html">
          <span class="badge">Unit 4</span>
          <h3>A2 Macro（Unit 4）</h3>
          <p class="muted">全球化、贸易、汇率、金融市场、发展经济学。</p>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
